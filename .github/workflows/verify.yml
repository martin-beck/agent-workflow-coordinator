name: Verify

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  awq:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the reviewed AWQ source pin
        env:
          AWQ_COMMIT: f1c40859e9d10cacbc79100ed136c38bce48cd39
        run: python3 -c 'import os,re; raise SystemExit(0 if re.fullmatch(r"[0-9a-f]{40}", os.environ["AWQ_COMMIT"]) else 1)'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: martin-beck/agent-workflow-quality
          ref: f1c40859e9d10cacbc79100ed136c38bce48cd39
          path: quality-runtime
          persist-credentials: false
          fetch-depth: 1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.8"
          enable-cache: false
      - name: Install the pinned AWQ source environment
        run: uv sync --directory quality-runtime --locked --python 3.12.14
      - name: Run AWQ portable PR gates
        run: |
          uv run --directory quality-runtime --frozen python -m awq --root .. onboarding --format json
          uv run --directory quality-runtime --frozen python -m awq --root .. check --tier pr --format json

  scope:
    runs-on: ubuntu-24.04
    outputs:
      formal_changed: ${{ steps.scope.outputs.formal_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT" != "pull_request" ]] || git diff --name-only "$BASE...$HEAD" | grep -Eq "^(formal/|tools/tlc_runner.py|\\.github/workflows/verify\\.yml)"; then
            echo "formal_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "formal_changed=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: [awq, scope]
    if: ${{ github.event_name != 'pull_request' || needs.scope.outputs.formal_changed == 'true' }}
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","Linux","X64","agent-workflow-coordinator-ci"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 120 || 30 }}
    env:
      TLC_TIER: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full-exhaustive' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'portable-smoke' || 'pr-publication' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --only-group quality
      - name: Source license headers
        run: uv run python tools/check_source_headers.py
      - name: Format lint and type
        run: |
          uv run ruff format --check tools tests
          uv run ruff check --no-fix tools tests
          uv run mypy tools tests
          uv run lizard -l python --CCN 14 tools/handoffctl.py
      - name: Tests and branch coverage
        run: |
          uv run coverage run --branch -m unittest discover -s tests -p 'test_*.py'
          uv run coverage report --fail-under=95
      - name: Validate examples
        run: |
          uv run python -m json.tool examples/project/.handoffctl.json >/dev/null
          uv run python -m json.tool examples/project/coordinator.backend.json >/dev/null
          uv run python -m json.tool examples/project/runtime-config.example.json >/dev/null
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          profile = json.loads(Path("examples/project/.handoffctl.json").read_text())
          schema = json.loads(Path("schema/project-config.schema.json").read_text())
          jsonschema.Draft202012Validator(schema, format_checker=jsonschema.FormatChecker()).validate(profile)
          backend = json.loads(Path("examples/project/coordinator.backend.json").read_text())
          backend_schema = json.loads(Path("schema/backend-config.schema.json").read_text())
          jsonschema.Draft202012Validator(
              backend_schema, format_checker=jsonschema.FormatChecker()
          ).validate(backend)
          PY
      - name: Establish existing runner user bus and cgroup prerequisite
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          runner_uid=$(id -u)
          runtime_dir="/run/user/${runner_uid}"
          bus_address="unix:path=${runtime_dir}/bus"
          echo "XDG_RUNTIME_DIR=${runtime_dir}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=${bus_address}" >> "$GITHUB_ENV"
          test -S "${runtime_dir}/bus"
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          XDG_RUNTIME_DIR="${runtime_dir}" DBUS_SESSION_BUS_ADDRESS="${bus_address}" \
            systemd-run --user --wait --pipe --quiet true
      - name: Run event-appropriate formal tier
        env:
          TLC_CGROUP_MODE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'portable' || 'required' }}
          TLC_HEAP: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '512m' || '2048m' }}
          TLC_TIMEOUT_SECONDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '6000' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '600' || '1200' }}
          TLC_ATTESTATION_PATH: ${{ runner.temp }}/formal-attestation.json
        run: formal/handoffctl/verify.sh --tier "$TLC_TIER"
      - name: Publish exact-head tier attestation
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: handoffctl-${{ env.TLC_TIER }}-${{ github.sha }}
          path: ${{ runner.temp }}/formal-attestation.json
          if-no-files-found: error
      - name: DCO certification
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          while IFS= read -r revision; do
            expected=$(git show -s --format='Signed-off-by: %an <%ae>' "$revision")
            git show -s --format=%B "$revision" | grep -Fx -- "$expected"
          done < <(git rev-list "$BASE..$HEAD")

  smoke:
    needs: [awq, scope]
    if: ${{ github.event_name == 'pull_request' && needs.scope.outputs.formal_changed == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - name: Portable smoke model (non-exhaustive)
        env:
          TLC_CGROUP_MODE: portable
          TLC_HEAP: 512m
          TLC_ATTESTATION_PATH: ${{ runner.temp }}/portable-smoke-attestation.json
        run: formal/handoffctl/verify.sh --tier portable-smoke
      - name: Publish non-exhaustive smoke attestation
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: handoffctl-portable-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/portable-smoke-attestation.json
          if-no-files-found: error
