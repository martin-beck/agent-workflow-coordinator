name: Formal

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Bounded validation is intentionally separate from exploratory stress.
  # The latter has its own workflow, runner label, admission paths, and
  # concurrency domain, so it cannot delay this minute-scale workflow.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-pr-publication
  cancel-in-progress: false

jobs:
  formal-trusted:
    # Never run untrusted fork code on the local constrained runner. The
    # portable Verify signal still covers that case, while this exact-head
    # receipt is available for repository pull requests and main candidates.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Hosted CI is advisory evidence only, never an external progression gate.
    continue-on-error: true
    runs-on: [self-hosted, Linux, X64, agent-workflow-coordinator-ci]
    timeout-minutes: 15
    env:
      TLC_TIER: pr-publication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --only-group quality
      - name: Establish existing runner user bus and capacity prerequisite
        shell: bash
        run: |
          runner_uid=$(id -u)
          runtime_dir="/run/user/${runner_uid}"
          bus_address="unix:path=${runtime_dir}/bus"
          echo "XDG_RUNTIME_DIR=${runtime_dir}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=${bus_address}" >> "$GITHUB_ENV"
          test -S "${runtime_dir}/bus"
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          required_bytes=$((6 * 1024 * 1024 * 1024))
          host_bytes=$(awk '/^MemTotal:/ {print $2 * 1024}' /proc/meminfo)
          test "${host_bytes}" -ge "${required_bytes}"
          cgroup_relative=$(awk -F: '$1 == "0" {print $3; exit}' /proc/self/cgroup)
          cgroup_mount=$(awk '$0 ~ / - cgroup2 / {print $5; exit}' /proc/self/mountinfo)
          test -n "${cgroup_relative}"
          test -n "${cgroup_mount}"
          cgroup_dir="${cgroup_mount%/}${cgroup_relative:-/}"
          test -r "${cgroup_dir}/memory.max"
          test -r "${cgroup_dir}/memory.swap.max"
          parent_memory=$(cat "${cgroup_dir}/memory.max")
          if [[ "${parent_memory}" != max ]]; then test "${parent_memory}" -ge "${required_bytes}"; fi
          parent_swap=$(cat "${cgroup_dir}/memory.swap.max")
          if [[ "${parent_swap}" != max ]]; then test "${parent_swap}" -ge "${required_bytes}"; fi
          # tools/tlc_runner.py verifies the effective limits from inside its
          # own transient unit immediately before every TLC process starts.
          command -v systemd-run
      - name: Run bounded formal tier
        env:
          TLC_CGROUP_MODE: required
          TLC_HEAP: 2048m
          TLC_MEMORY_MAX: 3G
          TLC_SWAP_MAX: 3G
          TLC_BUDGET_SECONDS: "900"
          TLC_ATTESTATION_PATH: ${{ runner.temp }}/formal-attestation.json
        run: formal/handoffctl/verify.sh --tier "$TLC_TIER"
      - name: Validate local exact-head bounded receipt
        run: |
          python3 tools/formal_receipt.py \
            --receipt "${{ runner.temp }}/formal-attestation.json" \
            --candidate "$(git rev-parse HEAD)" \
            --tier pr-publication
      - name: Publish exact-head tier attestation
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: handoffctl-${{ env.TLC_TIER }}-${{ github.sha }}
          path: ${{ runner.temp }}/formal-attestation.json
          if-no-files-found: error
