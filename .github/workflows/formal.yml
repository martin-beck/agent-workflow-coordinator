name: Formal

"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: Formal verification tier to run on main
        required: true
        default: pr-fast
        type: choice
        options:
          - pr-fast
          - pr-publication
          - full-exhaustive
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  # Full qualification is bound to its triggering immutable SHA and remains
  # useful evidence even when main advances.  Do not cancel it merely because
  # autonomous development merged another change; release admission still
  # requires a fresh exact-main attestation.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.tier == 'full-exhaustive') && 'full-exhaustive' || 'pr-fast' }}
  cancel-in-progress: false

jobs:
  formal-trusted:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, agent-workflow-coordinator-ci]
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.tier == 'full-exhaustive') && 1440 || inputs.tier == 'pr-publication' && 15 || 5 }}
    # Full-exhaustive remains scheduled/manual advisory evidence until AR-0102;
    # it must not obstruct ordinary development progression.
    continue-on-error: ${{ github.event_name == 'schedule' || inputs.tier == 'full-exhaustive' }}
    env:
      TLC_TIER: ${{ github.event_name == 'schedule' && 'full-exhaustive' || inputs.tier || 'pr-fast' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --only-group quality
      - name: Establish existing runner user bus and capacity prerequisite
        shell: bash
        run: |
          runner_uid=$(id -u)
          runtime_dir="/run/user/${runner_uid}"
          bus_address="unix:path=${runtime_dir}/bus"
          echo "XDG_RUNTIME_DIR=${runtime_dir}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=${bus_address}" >> "$GITHUB_ENV"
          test -S "${runtime_dir}/bus"
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          if [[ "${TLC_TIER}" == "full-exhaustive" ]]; then
            required_bytes=$((64 * 1024 * 1024 * 1024))
          else
            required_bytes=$((6 * 1024 * 1024 * 1024))
          fi
          host_bytes=$(awk '/^MemTotal:/ {print $2 * 1024}' /proc/meminfo)
          test "${host_bytes}" -ge "${required_bytes}"
          cgroup_relative=$(awk -F: '$1 == "0" {print $3; exit}' /proc/self/cgroup)
          cgroup_mount=$(awk '$0 ~ / - cgroup2 / {print $5; exit}' /proc/self/mountinfo)
          test -n "${cgroup_relative}"
          test -n "${cgroup_mount}"
          cgroup_dir="${cgroup_mount%/}${cgroup_relative:-/}"
          test -r "${cgroup_dir}/memory.max"
          test -r "${cgroup_dir}/memory.swap.max"
          parent_memory=$(cat "${cgroup_dir}/memory.max")
          if [[ "${parent_memory}" != max ]]; then test "${parent_memory}" -ge "${required_bytes}"; fi
          parent_swap=$(cat "${cgroup_dir}/memory.swap.max")
          if [[ "${parent_swap}" != max ]]; then test "${parent_swap}" -ge "${required_bytes}"; fi
          # tools/tlc_runner.py verifies the effective limits from inside its
          # own transient unit immediately before every TLC process starts.
          command -v systemd-run
      - name: Run required formal tier
        env:
          TLC_CGROUP_MODE: required
          TLC_HEAP: ${{ (github.event_name == 'schedule' || inputs.tier == 'full-exhaustive') && '48g' || '2048m' }}
          TLC_MEMORY_MAX: ${{ (github.event_name == 'schedule' || inputs.tier == 'full-exhaustive') && '64G' || '3G' }}
          TLC_SWAP_MAX: ${{ (github.event_name == 'schedule' || inputs.tier == 'full-exhaustive') && '64G' || '3G' }}
          TLC_BUDGET_SECONDS: ${{ (github.event_name == 'schedule' || inputs.tier == 'full-exhaustive') && '86400' || inputs.tier == 'pr-publication' && '900' || '300' }}
          TLC_ATTESTATION_PATH: ${{ runner.temp }}/formal-attestation.json
        run: formal/handoffctl/verify.sh --tier "$TLC_TIER"
      - name: Publish exact-head tier attestation
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: handoffctl-${{ env.TLC_TIER }}-${{ github.sha }}
          path: ${{ runner.temp }}/formal-attestation.json
          if-no-files-found: error
