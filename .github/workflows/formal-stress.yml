name: Advisory Formal Stress

"on":
  workflow_dispatch:
    inputs:
      retry_note:
        description: Optional note to distinguish a retry from an earlier exploratory run
        required: false
        type: string
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

# Stress runs serialize only with other stress runs. They have no shared
# concurrency group with Verify or Formal, and each run remains separately
# cancelable from the Actions UI. workflow_dispatch provides an explicit retry
# route without a pull request, release, or external review dependency.
concurrency:
  group: advisory-formal-stress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exploratory-stress:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, agent-workflow-coordinator-formal-stress]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - name: Establish dedicated stress capacity
        shell: bash
        run: |
          runner_uid=$(id -u)
          runtime_dir="/run/user/${runner_uid}"
          echo "XDG_RUNTIME_DIR=${runtime_dir}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=${runtime_dir}/bus" >> "$GITHUB_ENV"
          test -S "${runtime_dir}/bus"
          test "$(stat -fc %T /sys/fs/cgroup)" = cgroup2fs
          required_bytes=$((64 * 1024 * 1024 * 1024))
          host_bytes=$(awk '/^MemTotal:/ {print $2 * 1024}' /proc/meminfo)
          test "${host_bytes}" -ge "${required_bytes}"
          command -v systemd-run
      - name: Run exploratory full-exhaustive stress
        shell: bash
        env:
          TLC_TIER: full-exhaustive
          TLC_CGROUP_MODE: required
          TLC_HEAP: 48g
          TLC_MEMORY_MAX: 64G
          TLC_SWAP_MAX: 64G
          TLC_BUDGET_SECONDS: "86400"
          TLC_WORK_ROOT: ${{ runner.temp }}/formal-stress-workspaces
          TLC_DIAGNOSTICS_DIR: ${{ runner.temp }}/formal-stress-diagnostics
          TLC_ATTESTATION_PATH: ${{ runner.temp }}/formal-stress-diagnostics/formal-attestation.json
        run: |
          formal/handoffctl/verify.sh --tier full-exhaustive \
            --diagnostic-queue "${RUNNER_TEMP}/formal-stress-queue" \
            --diagnostic-admission-lock "${RUNNER_TEMP}/formal-stress-admission.lock"
      - name: Publish exploratory stress receipt and bounded diagnostics
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: exploratory-formal-stress-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/formal-stress-diagnostics
          if-no-files-found: warn
