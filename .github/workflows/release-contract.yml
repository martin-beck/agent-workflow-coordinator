name: Release contract

on:
  workflow_dispatch:
    inputs:
      transition:
        description: Path to a release transition JSON in the checkout
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Generate and validate release contract
        env:
          TRANSITION: ${{ inputs.transition || 'release/transition.json' }}
        run: |
          uv run python tools/release_contract.py "$TRANSITION" release/upgrade-contract.json
          uv run python tools/validate_upgrade_contract.py release/upgrade-contract.json
      - name: Upload sanitized contract evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: release-upgrade-contract-${{ github.sha }}
          path: release/upgrade-contract.json
          if-no-files-found: error
