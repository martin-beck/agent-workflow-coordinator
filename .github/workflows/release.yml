name: Release upgrade contract
"on":
  workflow_dispatch:
    inputs:
      transition:
        description: Repository-relative JSON transition input
        required: true
        type: string
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.8"
      - name: Generate and validate release contract
        env:
          TRANSITION: ${{ inputs.transition }}
        run: |
          test -n "$TRANSITION"
          case "$TRANSITION" in /*|*..*) exit 1;; esac
          uv run python -m tools.verify_release_identity "$TRANSITION" \
            --repository "$GITHUB_WORKSPACE" --workspace "$GITHUB_WORKSPACE"
          uv run python -m tools.verify_release_contract "$TRANSITION" "$RUNNER_TEMP/release-contract.json"
          uv run python -m tools.generate_upgrade_runbook \
            "$RUNNER_TEMP/release-contract.json" "$RUNNER_TEMP/release-runbooks"
          uv run python -m tools.verify_upgrade_runbook \
            "$RUNNER_TEMP/release-contract.json" "$RUNNER_TEMP/release-runbooks"
      - name: Revalidate from a fresh clone
        env:
          TRANSITION: ${{ inputs.transition }}
        run: |
          git clone --no-local --no-hardlinks "$GITHUB_WORKSPACE" "$RUNNER_TEMP/release-clone"
          uv run --directory "$RUNNER_TEMP/release-clone" python -m tools.verify_release_identity \
            "$TRANSITION" --repository "$RUNNER_TEMP/release-clone" \
            --workspace "$RUNNER_TEMP/release-clone"
          uv run --directory "$RUNNER_TEMP/release-clone" python -m tools.verify_release_contract \
            "$TRANSITION" "$RUNNER_TEMP/release-clone/release-contract.json"
          uv run --directory "$RUNNER_TEMP/release-clone" python -m tools.generate_upgrade_runbook \
            "$RUNNER_TEMP/release-clone/release-contract.json" "$RUNNER_TEMP/release-clone/release-runbooks"
          uv run --directory "$RUNNER_TEMP/release-clone" python -m tools.verify_upgrade_runbook \
            "$RUNNER_TEMP/release-clone/release-contract.json" "$RUNNER_TEMP/release-clone/release-runbooks"
          cmp -- "$RUNNER_TEMP/release-contract.json" "$RUNNER_TEMP/release-clone/release-contract.json"
          cmp -- "$RUNNER_TEMP/release-runbooks/operator.md" \
            "$RUNNER_TEMP/release-clone/release-runbooks/operator.md"
          cmp -- "$RUNNER_TEMP/release-runbooks/agent.md" \
            "$RUNNER_TEMP/release-clone/release-runbooks/agent.md"
      - name: Bind published evidence to the exact source
        run: |
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GITHUB_SHA is not a 40-hex source identity" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "checked-out HEAD does not match GITHUB_SHA" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1)" ]]; then
            echo "checked-out source is not clean" >&2
            exit 1
          fi
          export LC_ALL=C
          test "$(find "$RUNNER_TEMP/release-runbooks" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | paste -sd, -)" = "agent.md,operator.md"
          for artifact in release-contract.json release-runbooks/operator.md release-runbooks/agent.md; do
            test -f "$RUNNER_TEMP/$artifact"
            test ! -L "$RUNNER_TEMP/$artifact"
          done
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/release-source-commit.txt"
          test -s "$RUNNER_TEMP/release-source-commit.txt"
          test "$(wc -l < "$RUNNER_TEMP/release-source-commit.txt")" -eq 1
          test "$(cat "$RUNNER_TEMP/release-source-commit.txt")" = "$GITHUB_SHA"
          (
            cd "$RUNNER_TEMP"
            sha256sum release-contract.json release-runbooks/operator.md release-runbooks/agent.md
          ) > "$RUNNER_TEMP/release-artifacts.sha256"
          test "$(wc -l < "$RUNNER_TEMP/release-artifacts.sha256")" -eq 3
          grep -Eq '^[0-9a-f]{64}  release-contract\.json$' "$RUNNER_TEMP/release-artifacts.sha256"
          grep -Eq '^[0-9a-f]{64}  release-runbooks/operator\.md$' "$RUNNER_TEMP/release-artifacts.sha256"
          grep -Eq '^[0-9a-f]{64}  release-runbooks/agent\.md$' "$RUNNER_TEMP/release-artifacts.sha256"
          (
            cd "$RUNNER_TEMP"
            sha256sum --check --strict release-artifacts.sha256
          )
      - name: Upload sanitized contract evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: release-upgrade-contract-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-contract.json
            ${{ runner.temp }}/release-runbooks
            ${{ runner.temp }}/release-source-commit.txt
            ${{ runner.temp }}/release-artifacts.sha256
          if-no-files-found: error
