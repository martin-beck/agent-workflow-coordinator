name: Release upgrade contract
"on":
  workflow_dispatch:
    inputs:
      transition:
        description: Repository-relative JSON transition input
        required: true
        type: string
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.8"
      - name: Generate and validate release contract
        env:
          TRANSITION: ${{ inputs.transition }}
        run: |
          test -n "$TRANSITION"
          case "$TRANSITION" in /*|*..*) exit 1;; esac
          uv run python -m tools.verify_release_identity "$TRANSITION" \
            --repository "$GITHUB_WORKSPACE" --workspace "$GITHUB_WORKSPACE"
          uv run python -m tools.verify_release_contract "$TRANSITION" "$RUNNER_TEMP/release-contract.json"
          uv run python -m tools.generate_upgrade_runbook \
            "$RUNNER_TEMP/release-contract.json" "$RUNNER_TEMP/release-runbooks"
          uv run python -m tools.verify_upgrade_runbook \
            "$RUNNER_TEMP/release-contract.json" "$RUNNER_TEMP/release-runbooks"
      - name: Revalidate from a fresh clone
        env:
          TRANSITION: ${{ inputs.transition }}
        run: |
          git clone --no-local --no-hardlinks "$GITHUB_WORKSPACE" "$RUNNER_TEMP/release-clone"
          uv run --directory "$RUNNER_TEMP/release-clone" python -m tools.verify_release_identity \
            "$TRANSITION" --repository "$RUNNER_TEMP/release-clone" \
            --workspace "$RUNNER_TEMP/release-clone"
          uv run --directory "$RUNNER_TEMP/release-clone" python -m tools.verify_release_contract \
            "$TRANSITION" "$RUNNER_TEMP/release-clone/release-contract.json"
          uv run --directory "$RUNNER_TEMP/release-clone" python -m tools.generate_upgrade_runbook \
            "$RUNNER_TEMP/release-clone/release-contract.json" "$RUNNER_TEMP/release-clone/release-runbooks"
          uv run --directory "$RUNNER_TEMP/release-clone" python -m tools.verify_upgrade_runbook \
            "$RUNNER_TEMP/release-clone/release-contract.json" "$RUNNER_TEMP/release-clone/release-runbooks"
          cmp -- "$RUNNER_TEMP/release-contract.json" "$RUNNER_TEMP/release-clone/release-contract.json"
          cmp -- "$RUNNER_TEMP/release-runbooks/operator.md" \
            "$RUNNER_TEMP/release-clone/release-runbooks/operator.md"
          cmp -- "$RUNNER_TEMP/release-runbooks/agent.md" \
            "$RUNNER_TEMP/release-clone/release-runbooks/agent.md"
      - name: Render and self-test release signer (non-publishing)
        env:
          RELEASE_TRANSITION: ${{ inputs.transition }}
        run: |
          signer_dir="$(mktemp -d)"
          chmod 700 "$signer_dir"
          python - "$signer_dir/awc-sign-release.sh" <<'PY'
          import hashlib, json, os, shlex, subprocess, sys, tempfile
          from pathlib import Path
          template = Path("docs/templates/awc-sign-release.sh.in").read_text()
          transition_path = Path(os.environ["RELEASE_TRANSITION"])
          transition = json.loads(transition_path.read_text(encoding="utf-8"))
          def config(name: str) -> str:
              value = subprocess.run(["git", "config", "--get", name], capture_output=True, text=True, check=False).stdout.strip()
              if not value or "\n" in value:
                  raise SystemExit(f"required release signer policy is not configured: {name}")
              return value
          key = config("user.signingkey")
          if config("gpg.format") != "ssh":
              raise SystemExit("release signing requires gpg.format=ssh")
          policy = config("gpg.ssh.allowedSignersFile")
          identity = config("user.email")
          canonical_identity = "martin.beck2@gmx.de"
          if identity != canonical_identity:
              raise SystemExit("configured release identity does not match the canonical GitHub release identity")
          policy_path = Path(policy).expanduser()
          key_path = Path(key).expanduser()
          if not key_path.is_file():
              raise SystemExit("configured release signing key material is unavailable")
          key_probe = subprocess.run(["ssh-keygen", "-lf", str(key_path)], capture_output=True, text=True, check=False)
          if key_probe.returncode != 0:
              raise SystemExit("configured release signing key material is invalid")
          key_fingerprint = next((part for part in key_probe.stdout.split() if part.startswith("SHA256:")), "")
          if not key_fingerprint:
              raise SystemExit("configured release signing key fingerprint is unavailable")
          try:
              policy_text = policy_path.read_text()
              authorized = False
              for line in policy_text.splitlines():
                  fields = line.split()
                  key_types = {"ssh-ed25519", "ssh-rsa", "ssh-dss", "ecdsa-sha2-nistp256", "ecdsa-sha2-nistp384", "ecdsa-sha2-nistp521", "sk-ssh-ed25519@openssh.com", "sk-ecdsa-sha2-nistp256@openssh.com"}
                  if len(fields) < 3 or identity not in fields[0].split(","):
                      continue
                  try:
                      key_index = next(i for i, field in enumerate(fields[1:], 1) if field in key_types)
                      key_fields = fields[key_index : key_index + 2]
                      if len(key_fields) != 2:
                          continue
                  except StopIteration:
                      continue
                  with tempfile.NamedTemporaryFile("w", delete=False) as candidate:
                      candidate.write(" ".join(key_fields) + "\n")
                      candidate_path = candidate.name
                  try:
                      probe = subprocess.run(["ssh-keygen", "-lf", candidate_path], capture_output=True, text=True, check=False)
                      authorized = key_fingerprint in probe.stdout.split()
                  finally:
                      os.unlink(candidate_path)
                  if authorized:
                      break
          except OSError:
              authorized = False
          if not authorized:
              raise SystemExit("configured release identity is not authorized by the GitHub release-key policy")
          policy_digest = hashlib.sha256(policy_text.encode()).hexdigest()
          values = {"@RELEASE_VERSION@": transition["to"]["version"], "@SOURCE_COMMIT@": transition["to"]["source_commit"], "@REPOSITORY@": os.environ["GITHUB_WORKSPACE"], "@FROM_TAG@": transition["from"]["tag_ref"], "@TO_TAG@": transition["to"]["tag_ref"], "@TRUST_POLICY@": transition["to"]["trust_policy_sha256"], "@VENDOR_MANIFEST@": transition["to"]["vendor_manifest_sha256"], "@OUTPUT@": os.path.join(os.environ["RUNNER_TEMP"], "release-signature.json"), "@SIGNING_KEY_REF@": key, "@SIGNING_POLICY_REF@": policy, "@SIGNING_IDENTITY@": identity, "@SIGNING_KEY_FINGERPRINT@": key_fingerprint, "@SIGNING_POLICY_DIGEST@": policy_digest}
          for placeholder, value in values.items(): template = template.replace(placeholder, shlex.quote(value))
          target = Path(sys.argv[1]); target.write_text(template); target.chmod(0o700)
          PY
          echo "Generated signer: $signer_dir/awc-sign-release.sh (runner-local, retained for this job; self-test only, no signing or publication)" | tee -a "$GITHUB_STEP_SUMMARY"
          "$signer_dir/awc-sign-release.sh" --self-test
      - name: Bind published evidence to the exact source
        run: |
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GITHUB_SHA is not a 40-hex source identity" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "checked-out HEAD does not match GITHUB_SHA" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1)" ]]; then
            echo "checked-out source is not clean" >&2
            exit 1
          fi
          export LC_ALL=C
          test "$(find "$RUNNER_TEMP/release-runbooks" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | paste -sd, -)" = "agent.md,operator.md"
          for artifact in release-contract.json release-runbooks/operator.md release-runbooks/agent.md; do
            test -f "$RUNNER_TEMP/$artifact"
            test ! -L "$RUNNER_TEMP/$artifact"
            test "$(stat -c '%u' "$RUNNER_TEMP/$artifact")" = "$(id -u)"
            artifact_mode="$(stat -c '%a' "$RUNNER_TEMP/$artifact")"
            (( (8#$artifact_mode & 022) == 0 ))
          done
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/release-source-commit.txt"
          test -s "$RUNNER_TEMP/release-source-commit.txt"
          test "$(wc -l < "$RUNNER_TEMP/release-source-commit.txt")" -eq 1
          test "$(cat "$RUNNER_TEMP/release-source-commit.txt")" = "$GITHUB_SHA"
          (
            cd "$RUNNER_TEMP"
            sha256sum release-contract.json release-runbooks/operator.md release-runbooks/agent.md
          ) > "$RUNNER_TEMP/release-artifacts.sha256"
          test "$(wc -l < "$RUNNER_TEMP/release-artifacts.sha256")" -eq 3
          grep -Eq '^[0-9a-f]{64}  release-contract\.json$' "$RUNNER_TEMP/release-artifacts.sha256"
          grep -Eq '^[0-9a-f]{64}  release-runbooks/operator\.md$' "$RUNNER_TEMP/release-artifacts.sha256"
          grep -Eq '^[0-9a-f]{64}  release-runbooks/agent\.md$' "$RUNNER_TEMP/release-artifacts.sha256"
          (
            cd "$RUNNER_TEMP"
            sha256sum --check --strict release-artifacts.sha256
          )
      - name: Upload sanitized contract evidence
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: release-upgrade-contract-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-contract.json
            ${{ runner.temp }}/release-runbooks
            ${{ runner.temp }}/release-source-commit.txt
            ${{ runner.temp }}/release-artifacts.sha256
          if-no-files-found: error
