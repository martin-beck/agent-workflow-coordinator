CONSTANTS
    Processes = {p1, p2}
    Tasks = {"t1", "t2"}
    Actors = {a1, a2}
    NoProcess = NoProcess
    NoActor = NoActor
    NoTask = "NoTask"
    MaxRevision = 2
    AllowedOperations = [p \in {p1, p2} |-> {"promote", "resume", "unblock", "pause", "claim", "heartbeat", "update", "accept", "bind-spec", "bind-worktree", "recover_expired", "release_planned", "release_open", "release_blocked", "release_done"}]

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OwnershipCoherence
    BlockedProvenance
    HierarchyCoherent
    UniqueActiveOwner
    LockSafety
    RevisionAccounting
    ProjectionAtomicity
    SpecBindingIsMonotonic
    AcceptedSpecBindIsBound
    WorktreeBindingIsMonotonic
    AcceptedWorktreeBindIsBound
    UniqueActiveWorktreeIdentity

PROPERTIES
    EventualCompletion
