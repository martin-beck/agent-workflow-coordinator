CONSTANTS
    Owners = {owner1, owner2}
    Roles = {implementer, reviewer, security}
    Tasks = {task1, security_task}
    Actions = {read, mutate}
    NoOwner = NoOwner
    NoReviewer = NoReviewer
    MutationActions = {mutate}
    SecurityTasks = {security_task}
